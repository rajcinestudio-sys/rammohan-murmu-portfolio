<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="uiBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#02141d" />
      <stop offset="50%" stop-color="#062e3f" />
      <stop offset="100%" stop-color="#031b26" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <filter id="glassBlur">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="600" height="400" fill="url(#uiBg)" />

  <!-- Background Glowing Orbs -->
  <circle cx="150" cy="120" r="100" fill="#06b6d4" opacity="0.2" filter="url(#glassBlur)" />
  <circle cx="450" cy="280" r="120" fill="#8b5cf6" opacity="0.2" filter="url(#glassBlur)" />

  <!-- Mobile Phone Mockup (Center) -->
  <g transform="translate(180, 25)">
    <!-- Phone Outer Body -->
    <rect width="240" height="350" rx="36" fill="#0b1329" stroke="#1e293b" stroke-width="4" />
    <!-- Screen Notch/Island -->
    <rect x="80" y="10" width="80" height="18" rx="9" fill="#020617" />
    
    <!-- Credit / Crypto Card (Glassmorphism) -->
    <g transform="translate(20, 45)">
      <rect width="200" height="110" rx="16" fill="url(#cardGrad)" opacity="0.95" />
      <circle cx="170" cy="30" r="16" fill="#ffffff" opacity="0.3" />
      <circle cx="152" cy="30" r="16" fill="#ffffff" opacity="0.2" />
      <text x="20" y="32" font-family="'Outfit', sans-serif" font-size="12" font-weight="700" fill="#ffffff">NovaCard Metal</text>
      <text x="20" y="70" font-family="'Outfit', sans-serif" font-size="20" font-weight="900" fill="#ffffff">$48,920.50</text>
      <text x="20" y="94" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" fill="#e0f2fe">•••• 8824  |  09/28</text>
    </g>

    <!-- Quick Action Icons -->
    <g transform="translate(25, 175)">
      <circle cx="20" cy="20" r="18" fill="#1e293b" />
      <text x="20" y="24" font-family="'Outfit', sans-serif" font-size="12" fill="#38bdf8" text-anchor="middle">↑</text>
      <circle cx="70" cy="20" r="18" fill="#1e293b" />
      <text x="70" y="24" font-family="'Outfit', sans-serif" font-size="12" fill="#38bdf8" text-anchor="middle">↓</text>
      <circle cx="120" cy="20" r="18" fill="#1e293b" />
      <text x="120" y="24" font-family="'Outfit', sans-serif" font-size="12" fill="#38bdf8" text-anchor="middle">⇄</text>
      <circle cx="170" cy="20" r="18" fill="#1e293b" />
      <text x="170" y="24" font-family="'Outfit', sans-serif" font-size="12" fill="#38bdf8" text-anchor="middle">★</text>
    </g>

    <!-- Transaction List items -->
    <g transform="translate(20, 230)">
      <rect width="200" height="42" rx="10" fill="#131e3a" />
      <circle cx="22" cy="21" r="12" fill="#0284c7" />
      <text x="44" y="20" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#ffffff">Bitcoin (BTC)</text>
      <text x="44" y="32" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#94a3b8">+2.4% Today</text>
      <text x="185" y="25" font-family="'Outfit', sans-serif" font-size="11" font-weight="800" fill="#10b981" text-anchor="end">+$1,450</text>
    </g>

    <g transform="translate(20, 280)">
      <rect width="200" height="42" rx="10" fill="#131e3a" />
      <circle cx="22" cy="21" r="12" fill="#7c3aed" />
      <text x="44" y="20" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#ffffff">Ethereum (ETH)</text>
      <text x="44" y="32" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#94a3b8">Staking Reward</text>
      <text x="185" y="25" font-family="'Outfit', sans-serif" font-size="11" font-weight="800" fill="#10b981" text-anchor="end">+$320</text>
    </g>
  </g>

  <!-- Floating Badges -->
  <g transform="translate(40, 40)">
    <rect width="110" height="32" rx="16" fill="#082f49" stroke="#0ea5e9" stroke-width="1.5" />
    <text x="55" y="21" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#38bdf8" text-anchor="middle">UI/UX DESIGN</text>
  </g>

  <g transform="translate(450, 40)">
    <rect width="110" height="32" rx="16" fill="#1e1b4b" stroke="#f59e0b" stroke-width="1.5" />
    <text x="55" y="21" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#fbbf24" text-anchor="middle">★ FEATURED</text>
  </g>

  <!-- Bottom Labels -->
  <text x="90" y="350" font-family="'Outfit', sans-serif" font-weight="900" font-size="20" fill="#ffffff">NOVAPAY APP</text>
  <text x="90" y="370" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#38bdf8">Fintech Dark UI/UX</text>
</svg>
