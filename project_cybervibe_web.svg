<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="webBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090514" />
      <stop offset="50%" stop-color="#140b28" />
      <stop offset="100%" stop-color="#041b24" />
    </linearGradient>
    <linearGradient id="glowG" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
  </defs>

  <rect width="600" height="400" fill="url(#webBg)" />

  <!-- Browser Window Frame (Glassmorphism 3D effect) -->
  <g transform="translate(60, 45)">
    <!-- Browser Chrome -->
    <rect width="480" height="310" rx="16" fill="#0f172a" stroke="#334155" stroke-width="2" />
    <path d="M0,16 Q0,0 16,0 L464,0 Q480,0 480,16 L480,42 L0,42 Z" fill="#1e293b" />
    <!-- Window Controls -->
    <circle cx="22" cy="21" r="6" fill="#ef4444" />
    <circle cx="40" cy="21" r="6" fill="#f59e0b" />
    <circle cx="58" cy="21" r="6" fill="#10b981" />
    <!-- URL Bar -->
    <rect x="90" y="11" width="300" height="20" rx="6" fill="#0f172a" />
    <text x="110" y="25" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#94a3b8">https://cybervibe.design (3D Interactive)</text>

    <!-- Web Page Hero Content -->
    <g transform="translate(30, 65)">
      <!-- Mini Navbar -->
      <text x="0" y="18" font-family="'Outfit', sans-serif" font-size="14" font-weight="900" fill="url(#glowG)">CYBERVIBE</text>
      <rect x="330" y="4" width="90" height="22" rx="11" fill="url(#glowG)" />
      <text x="375" y="19" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#ffffff" text-anchor="middle">LAUNCH APP</text>
      
      <!-- Hero Headline -->
      <text x="0" y="70" font-family="'Outfit', sans-serif" font-size="24" font-weight="900" fill="#ffffff">NEXT-GEN 3D</text>
      <text x="0" y="98" font-family="'Outfit', sans-serif" font-size="24" font-weight="900" fill="url(#glowG)">WEB EXPERIENCES</text>
      <text x="0" y="125" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#94a3b8">Interactive WebGL canvas, smooth micro-interactions &amp; speed.</text>

      <!-- 3D Geometric Cube / Mesh Wireframe -->
      <g transform="translate(320, 110)">
        <polygon points="0,-40 35,-20 0,0 -35,-20" fill="#8b5cf6" opacity="0.8" />
        <polygon points="0,0 35,-20 35,20 0,40" fill="#06b6d4" opacity="0.8" />
        <polygon points="-35,-20 0,0 0,40 -35,20" fill="#3b82f6" opacity="0.8" />
        <!-- Floating Particles -->
        <circle cx="-20" cy="-30" r="3" fill="#ffffff" />
        <circle cx="45" cy="10" r="2" fill="#10b981" />
        <circle cx="10" cy="-45" r="2" fill="#f59e0b" />
      </g>

      <!-- CTA Buttons -->
      <rect x="0" y="150" width="110" height="32" rx="8" fill="url(#glowG)" />
      <text x="55" y="171" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">Explore Work</text>
      <rect x="120" y="150" width="90" height="32" rx="8" fill="none" stroke="#64748b" stroke-width="1.5" />
      <text x="165" y="171" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#cbd5e1" text-anchor="middle">Contact</text>
    </g>
  </g>

  <!-- Floating Badge -->
  <g transform="translate(40, 30)">
    <rect width="110" height="30" rx="15" fill="#064e3b" stroke="#10b981" stroke-width="1.5" />
    <text x="55" y="20" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#34d399" text-anchor="middle">WEB DESIGN</text>
  </g>
</svg>
