<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="solarisBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22" />
      <stop offset="50%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#065f46" />
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
  </defs>

  <rect width="600" height="400" fill="url(#solarisBg)" />
  
  <!-- Creative Poster Layout -->
  <g transform="translate(160, 30)">
    <!-- Poster Card Body -->
    <rect width="280" height="340" rx="14" fill="#0f172a" stroke="#10b981" stroke-width="2" />
    
    <!-- Abstract Sun / Renewable Rays -->
    <circle cx="140" cy="120" r="60" fill="url(#sunGrad)" />
    <path d="M70,160 Q140,90 210,160 L210,230 L70,230 Z" fill="#10b981" opacity="0.7" />
    <path d="M90,180 Q140,130 190,180 L190,230 L90,230 Z" fill="#047857" />

    <!-- Poster Typography -->
    <text x="140" y="260" font-family="'Outfit', sans-serif" font-weight="900" font-size="20" fill="#f8fafc" text-anchor="middle" letter-spacing="3">SOLARIS ENERGY</text>
    <text x="140" y="280" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="10" fill="#34d399" text-anchor="middle" letter-spacing="2">CLEAN POWER REVOLUTION</text>
    <text x="140" y="305" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">Annual Global Campaign 2026</text>
  </g>

  <!-- Category Tag -->
  <g transform="translate(40, 40)">
    <rect width="130" height="32" rx="16" fill="#064e3b" stroke="#10b981" stroke-width="1.5" />
    <text x="65" y="21" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#34d399" text-anchor="middle">GRAPHIC DESIGN</text>
  </g>
</svg>
