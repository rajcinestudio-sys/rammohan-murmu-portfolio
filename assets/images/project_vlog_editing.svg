<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="vlogBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#180404" />
      <stop offset="50%" stop-color="#3b0707" />
      <stop offset="100%" stop-color="#1a0000" />
    </linearGradient>
    <linearGradient id="fireGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
  </defs>

  <rect width="600" height="400" fill="url(#vlogBg)" />

  <!-- YouTube Thumbnail Mockup -->
  <g transform="translate(100, 50)">
    <rect width="400" height="230" rx="16" fill="#09090b" stroke="#ef4444" stroke-width="2" />
    
    <!-- Thumbnail Big Bold Text Style -->
    <text x="30" y="80" font-family="'Outfit', sans-serif" font-weight="900" font-size="44" fill="#fef08a" stroke="#000000" stroke-width="2">I SURVIVED 100</text>
    <text x="30" y="130" font-family="'Outfit', sans-serif" font-weight="900" font-size="48" fill="url(#fireGrad)">DAYS IN 3D VFX!</text>
    
    <!-- Shock Face / Glow Burst graphic -->
    <circle cx="330" cy="115" r="50" fill="url(#fireGrad)" opacity="0.8" />
    <polygon points="320,90 350,115 320,140" fill="#ffffff" />
    
    <!-- Duration Tag -->
    <rect x="330" y="195" width="55" height="22" rx="4" fill="#000000" opacity="0.85" />
    <text x="357" y="210" font-family="'Outfit', sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">18:42</text>
  </g>

  <!-- Video Editing Stats -->
  <text x="300" y="325" font-family="'Outfit', sans-serif" font-weight="900" font-size="22" fill="#ffffff" text-anchor="middle">HIGH-RETENTION YOUTUBE MASTERY</text>
  <text x="300" y="350" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#f87171" text-anchor="middle">+42% Average View Duration • Fast-Paced Cuts &amp; SFX</text>

  <!-- Category Tag -->
  <g transform="translate(40, 40)">
    <rect width="120" height="32" rx="16" fill="#450a0a" stroke="#ef4444" stroke-width="1.5" />
    <text x="60" y="21" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#fca5a5" text-anchor="middle">VIDEO EDITING</text>
  </g>
</svg>
