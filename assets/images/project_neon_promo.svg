<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="videoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050814" />
      <stop offset="50%" stop-color="#110526" />
      <stop offset="100%" stop-color="#021c27" />
    </linearGradient>
    <linearGradient id="neonPink" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="50%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="cyanNeon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="videoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="600" height="400" fill="url(#videoBg)" />

  <!-- Video Timeline Grid & Audio Waveforms -->
  <g opacity="0.3">
    <!-- Equalizer bars -->
    <rect x="60" y="240" width="6" height="40" rx="3" fill="#f43f5e" />
    <rect x="75" y="220" width="6" height="60" rx="3" fill="#ec4899" />
    <rect x="90" y="200" width="6" height="80" rx="3" fill="#a855f7" />
    <rect x="105" y="230" width="6" height="50" rx="3" fill="#8b5cf6" />
    <rect x="120" y="210" width="6" height="70" rx="3" fill="#3b82f6" />
    <rect x="135" y="190" width="6" height="90" rx="3" fill="#06b6d4" />
    <rect x="150" y="235" width="6" height="45" rx="3" fill="#10b981" />
    
    <rect x="440" y="235" width="6" height="45" rx="3" fill="#10b981" />
    <rect x="455" y="190" width="6" height="90" rx="3" fill="#06b6d4" />
    <rect x="470" y="210" width="6" height="70" rx="3" fill="#3b82f6" />
    <rect x="485" y="230" width="6" height="50" rx="3" fill="#8b5cf6" />
    <rect x="500" y="200" width="6" height="80" rx="3" fill="#a855f7" />
    <rect x="515" y="220" width="6" height="60" rx="3" fill="#ec4899" />
    <rect x="530" y="240" width="6" height="40" rx="3" fill="#f43f5e" />
  </g>

  <!-- Glowing Soundwave Centerpiece -->
  <path d="M120,200 Q200,100 300,200 T480,200" fill="none" stroke="url(#neonPink)" stroke-width="4" filter="url(#videoGlow)" />
  <path d="M140,210 Q220,290 300,200 T460,190" fill="none" stroke="url(#cyanNeon)" stroke-width="3" filter="url(#videoGlow)" opacity="0.8" />

  <!-- 3D Holographic Play Button Hub -->
  <circle cx="300" cy="180" r="54" fill="#090518" stroke="url(#neonPink)" stroke-width="4" filter="url(#videoGlow)" />
  <circle cx="300" cy="180" r="66" fill="none" stroke="#06b6d4" stroke-width="2" stroke-dasharray="6 6" />
  <polygon points="290,160 322,180 290,200" fill="#ffffff" filter="url(#videoGlow)" />

  <!-- Video Meta Overlays -->
  <g transform="translate(180, 275)">
    <rect width="240" height="44" rx="22" fill="#090514" stroke="#ec4899" stroke-width="1.5" opacity="0.9" />
    <circle cx="25" cy="22" r="6" fill="#ef4444" />
    <text x="40" y="27" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="13" fill="#ffffff">4K 60FPS • CINEMATIC REEL</text>
    <text x="195" y="27" font-family="'Outfit', sans-serif" font-weight="700" font-size="12" fill="#38bdf8">02:45</text>
  </g>

  <!-- Title & Subtitle -->
  <text x="300" y="355" font-family="'Outfit', sans-serif" font-weight="900" font-size="28" letter-spacing="4" fill="#ffffff" text-anchor="middle" filter="url(#videoGlow)">NEON PULSE FESTIVAL</text>
  <text x="300" y="380" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="12" letter-spacing="3" fill="#ec4899" text-anchor="middle">CINEMATIC COLOR GRADING &amp; SOUND FX</text>

  <!-- Floating Badge -->
  <g transform="translate(40, 40)">
    <rect width="120" height="32" rx="16" fill="#2e0827" stroke="#f43f5e" stroke-width="1.5" />
    <text x="60" y="21" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#fb7185" text-anchor="middle">VIDEO EDITING</text>
  </g>
</svg>
