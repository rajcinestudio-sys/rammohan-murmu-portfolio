<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="auraBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0c" />
      <stop offset="50%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <linearGradient id="luxuryGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>
  </defs>

  <rect width="600" height="400" fill="url(#auraBg)" />

  <!-- 3D Luxury Watch Dial Showcase -->
  <g transform="translate(300, 180)">
    <!-- Watch Case Outer Ring -->
    <circle cx="0" cy="0" r="95" fill="#18181b" stroke="url(#luxuryGold)" stroke-width="6" />
    <circle cx="0" cy="0" r="82" fill="#09090b" stroke="#3f3f46" stroke-width="1.5" />
    
    <!-- Watch Dial Markers -->
    <line x1="0" y1="-75" x2="0" y2="-65" stroke="url(#luxuryGold)" stroke-width="3" />
    <line x1="75" y1="0" x2="65" y2="0" stroke="url(#luxuryGold)" stroke-width="3" />
    <line x1="0" y1="75" x2="0" y2="65" stroke="url(#luxuryGold)" stroke-width="3" />
    <line x1="-75" y1="0" x2="-65" y2="0" stroke="url(#luxuryGold)" stroke-width="3" />

    <!-- Watch Hands -->
    <line x1="0" y1="0" x2="35" y2="-35" stroke="#f8fafc" stroke-width="3" stroke-linecap="round" />
    <line x1="0" y1="0" x2="-20" y2="40" stroke="#f8fafc" stroke-width="4" stroke-linecap="round" />
    <line x1="0" y1="0" x2="50" y2="15" stroke="#d97706" stroke-width="1.5" stroke-linecap="round" />
    <circle cx="0" cy="0" r="6" fill="#d97706" />

    <!-- Brand Text inside Dial -->
    <text x="0" y="-30" font-family="'Outfit', sans-serif" font-weight="900" font-size="11" fill="url(#luxuryGold)" text-anchor="middle" letter-spacing="3">AURA</text>
    <text x="0" y="45" font-family="'Plus Jakarta Sans', sans-serif" font-size="7" fill="#71717a" text-anchor="middle">AUTOMATIC</text>
  </g>

  <!-- Typography -->
  <text x="300" y="325" font-family="'Outfit', sans-serif" font-weight="900" font-size="24" fill="url(#luxuryGold)" text-anchor="middle" letter-spacing="4">AURA CHRONOGRAPH</text>
  <text x="300" y="350" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#a1a1aa" text-anchor="middle">Luxury 3D E-Commerce Web Experience</text>

  <!-- Category Tag -->
  <g transform="translate(40, 40)">
    <rect width="110" height="30" rx="15" fill="#27272a" stroke="#d97706" stroke-width="1.5" />
    <text x="55" y="20" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#fbbf24" text-anchor="middle">WEB DESIGN</text>
  </g>
</svg>
