<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="60%" stop-color="#0f0e26" />
      <stop offset="100%" stop-color="#070714" />
    </radialGradient>
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="jacketGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#27272a" />
    </linearGradient>
    <linearGradient id="amberGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="subtleGlow">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Circle with Glow -->
  <circle cx="200" cy="200" r="190" fill="url(#bgGrad)" stroke="url(#neonGlow)" stroke-width="4" filter="url(#subtleGlow)" />
  
  <!-- Abstract 3D Geometric Rings / Orbit -->
  <ellipse cx="200" cy="200" rx="160" ry="70" fill="none" stroke="url(#neonGlow)" stroke-width="2" stroke-dasharray="6 8" transform="rotate(-25 200 200)" opacity="0.6" />
  <ellipse cx="200" cy="200" rx="150" ry="60" fill="none" stroke="#10b981" stroke-width="1.5" stroke-dasharray="4 6" transform="rotate(35 200 200)" opacity="0.5" />
  
  <!-- Floating Tool Badges (Photoshop, Figma, Premiere, 3D) -->
  <g transform="translate(60, 90)" filter="url(#subtleGlow)">
    <rect width="42" height="42" rx="10" fill="#001e36" stroke="#31a8ff" stroke-width="2" />
    <text x="21" y="27" font-family="'Outfit', sans-serif" font-weight="900" font-size="19" fill="#31a8ff" text-anchor="middle">Ps</text>
  </g>
  <g transform="translate(300, 80)" filter="url(#subtleGlow)">
    <rect width="42" height="42" rx="10" fill="#1e1e24" stroke="#a259ff" stroke-width="2" />
    <text x="21" y="27" font-family="'Outfit', sans-serif" font-weight="900" font-size="19" fill="#a259ff" text-anchor="middle">Fg</text>
  </g>
  <g transform="translate(45, 260)" filter="url(#subtleGlow)">
    <rect width="42" height="42" rx="10" fill="#1f0036" stroke="#ea77ff" stroke-width="2" />
    <text x="21" y="27" font-family="'Outfit', sans-serif" font-weight="900" font-size="19" fill="#ea77ff" text-anchor="middle">Pr</text>
  </g>
  <g transform="translate(310, 250)" filter="url(#subtleGlow)">
    <rect width="44" height="44" rx="10" fill="#022c22" stroke="#10b981" stroke-width="2" />
    <text x="22" y="28" font-family="'Outfit', sans-serif" font-weight="900" font-size="16" fill="#10b981" text-anchor="middle">&lt;/&gt;</text>
  </g>

  <!-- Stylized Character Avatar -->
  <!-- Shoulders & Hoodie/Jacket -->
  <path d="M110,380 C110,300 145,265 200,265 C255,265 290,300 290,380 Z" fill="url(#jacketGrad)" stroke="#3f3f46" stroke-width="2" />
  
  <!-- Cyber Jacket Accent Neon Straps -->
  <path d="M165,275 L150,380" stroke="#8b5cf6" stroke-width="3" stroke-linecap="round" />
  <path d="M235,275 L250,380" stroke="#06b6d4" stroke-width="3" stroke-linecap="round" />
  
  <!-- Neck -->
  <rect x="180" y="225" width="40" height="50" rx="8" fill="#e28743" />
  
  <!-- Head / Face -->
  <ellipse cx="200" cy="180" rx="46" ry="54" fill="url(#skinGrad)" />
  
  <!-- Designer Glasses with Neon Tint -->
  <rect x="162" y="165" width="32" height="24" rx="6" fill="#0f172a" stroke="#06b6d4" stroke-width="2.5" opacity="0.9" />
  <rect x="206" y="165" width="32" height="24" rx="6" fill="#0f172a" stroke="#06b6d4" stroke-width="2.5" opacity="0.9" />
  <line x1="194" y1="175" x2="206" y2="175" stroke="#06b6d4" stroke-width="2.5" />
  <!-- Lens Glint -->
  <path d="M166,170 L178,170" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
  <path d="M210,170 L222,170" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />

  <!-- Nose & Confident Smile -->
  <path d="M200,188 L197,196 L203,196" stroke="#c2410c" stroke-width="2" fill="none" stroke-linecap="round" />
  <path d="M188,206 Q200,216 212,206" stroke="#7c2d12" stroke-width="3" fill="none" stroke-linecap="round" />

  <!-- Modern Hairstyle with Stylish Neon Highlights -->
  <path d="M152,170 C148,135 170,110 200,110 C235,110 252,135 248,170 C242,145 220,135 200,135 C175,135 158,150 152,170 Z" fill="#18181b" />
  <path d="M165,130 C185,105 225,108 242,125 C230,120 195,118 165,130 Z" fill="#8b5cf6" filter="url(#subtleGlow)" />

  <!-- Designer Headphones -->
  <path d="M148,145 C148,115 252,115 252,145" fill="none" stroke="#6366f1" stroke-width="5" stroke-linecap="round" />
  <rect x="142" y="160" width="14" height="34" rx="6" fill="#4f46e5" stroke="#818cf8" stroke-width="2" />
  <rect x="244" y="160" width="14" height="34" rx="6" fill="#4f46e5" stroke="#818cf8" stroke-width="2" />

  <!-- Online Glowing Status Indicator -->
  <circle cx="270" cy="275" r="9" fill="#10b981" stroke="#052e16" stroke-width="3" filter="url(#subtleGlow)" />
  <circle cx="270" cy="275" r="4" fill="#ffffff" />
</svg>
